# DRAFT translation of the Abstract in the .md. The English abstract itself is
# read from the .md. Review before submitting.
resumo: |
  Este trabalho explora a integração do padrão Entity Component System (ECS) e de scripting no desenvolvimento de motores de jogos, com foco em seu papel na melhoria de desempenho, manutenibilidade, modularidade e complexidade de código. O ECS oferece uma abordagem orientada a dados para gerenciar entidades e comportamentos de jogos, tratando desafios relacionados à localidade de memória, ao custo do polimorfismo e ao paralelismo. O scripting possibilita a interação dinâmica e estática com o motor, por meio de Lua e C++, respectivamente, oferecendo maior acessibilidade quando o ECS é desnecessário. Este estudo analisa o impacto do ECS em funcionalidades centrais, como renderização gráfica e simulação física. As principais contribuições incluem benchmarks de desempenho, análises arquiteturais e diretrizes práticas para integrar ECS e scripting a motores de jogos, com implicações que se estendem a softwares de simulação e a outras aplicações críticas em desempenho.
palavras-chave: "Entity Component System. Motores de jogos. Scripting. Desempenho."
keywords: "Entity Component System. Game engines. Scripting. Performance."

